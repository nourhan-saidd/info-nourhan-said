<title>Nourhan Said – React Web Developer</title>
<style>
:root{--bg:#f3f4fa;--ink:#161b3d;--muted:#5d6385;--card:#fff;--line:#dfe2f2;--accent:#1d2fc4;--accent-ink:#fff;--shadow:0 10px 30px rgba(29,47,196,.10);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1124;--ink:#eef0ff;--muted:#a3a9d1;--card:#171b38;--line:#2a2f5a;--accent:#6f7dff;--accent-ink:#0e1124;--shadow:none}}
:root[data-theme="dark"]{--bg:#0e1124;--ink:#eef0ff;--muted:#a3a9d1;--card:#171b38;--line:#2a2f5a;--accent:#6f7dff;--accent-ink:#0e1124;--shadow:none}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Inter","Segoe UI",Tahoma,Arial,sans-serif;min-height:100vh;display:flex;justify-content:center;padding:36px 18px}
main{width:100%;max-width:440px}
.photo{width:124px;height:150px;border-radius:18px;object-fit:cover;display:block;margin:0 auto 20px;border:3px solid var(--card);box-shadow:var(--shadow)}
h1{font-size:26px;line-height:1.2;margin:0 0 6px;text-align:center;letter-spacing:-.01em}
.role{margin:0;text-align:center;color:var(--accent);font-weight:600;font-size:16px}
.sub{margin:6px 0 30px;text-align:center;color:var(--muted);font-size:14px}
.links{display:grid;gap:12px}
a.link{display:flex;align-items:center;gap:14px;padding:16px 18px;background:var(--card);border:1px solid var(--line);border-radius:14px;color:var(--ink);text-decoration:none;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
a.link:hover{transform:translateY(-2px);border-color:var(--accent)}
a.link:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.ic{flex:none;width:42px;height:42px;border-radius:11px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic svg.f{fill:currentColor;stroke:none}
.t b{display:block;font-size:16px}
.t span{font-size:13px;color:var(--muted)}
footer{margin-top:28px;text-align:center;font-size:13px}
footer a{color:var(--muted)}
</style>
